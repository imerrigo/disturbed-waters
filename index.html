---
layout: default
title: Aquatic Ecology in a Disturbed World
cover: '/images/aerial_photo.jpeg'
class: 'home-template'
navigation: True
logo: ''
current: home
---
<!-- < default -->
<!-- The tag above means - insert everything in this file into the [body] of the default.hbs template -->

<!-- The big featured header  -->
<header class="main-header {% if page.cover %}has-cover{% else %}no-cover{% endif %}"
  {% if page.cover %}
    style="background-image: url('{{ page.cover | relative_url }}')"
  {% endif %}>
  
  <nav>
    <!-- nav content here -->
  </nav>

  <div class="vertical">
    <div class="main-header-content inner">
      <h1 class="page-title">{{ site.name }}</h1>
      <h2 class="page-description">{{ site.description }}</h2>
    </div>
  </div>

  <a class="scroll-down icon-arrow-left" href="#content" data-offset="-45">
    <span class="hidden">Scroll Down</span>
  </a>
</header>

<!-- The main content area on the homepage -->
<main id="content" class="content" role="main">

    <!-- The tag below includes the post loop - partials/loop.hbs -->
    {% include loop.html %}

</main>
